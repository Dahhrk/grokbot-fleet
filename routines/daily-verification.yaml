name: Daily Verification
bot: tony-stark
trigger: "Every day at 7:00 AM"
prompt: |
  Run daily verification across all active projects.

  Steps:
  1. Read ~/projects/registry.md for the full project list.
  2. For each project with status: active, run its proof commands
     (listed in the registry under "proof").
  3. For UI projects (ui: yes), also check:
     - npm run anti-ai-ui (if the project has it)
     - npm run typecheck (if available)
  4. Collect results per project:
     - Project name
     - Each gate: pass or fail with error details
     - Overall: green or red
  5. Report to Harvey:
     - If all green: one line per project, "all gates green"
     - If any red: project name, which gate failed, exact error
     - If a project's doctor/launch fails, flag it immediately

  Do not fix anything. Do not open PRs. Report only.
  If doctor fails on any project, stop that project's checks and
  report the doctor failure. Do not invent evidence.
