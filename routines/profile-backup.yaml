name: Weekly Profile Backup
bot: dr-strange
trigger: "Every Sunday at 3:00 AM"
prompt: |
  Back up all bot profiles.

  Steps:
  1. Read all YAML files from ~/grokbot-fleet/profiles/
  2. Create a timestamped backup directory:
     ~/grokbot-fleet/backups/profiles-YYYY-MM-DD/
  3. Copy all profile YAML files into it.
  4. Delete backup directories older than 30 days.
  5. Stay quiet unless the backup fails.

  Never push backups to git. They stay local.
