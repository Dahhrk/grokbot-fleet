name: Auto-update Fleet Code
bot: dr-strange
trigger: "Every day at 6:00 AM"
prompt: |
  Check for updates to grokbot-fleet.

  Steps:
  1. cd ~/grokbot-fleet
  2. Run: git pull --ff-only
  3. If anything changed:
     - Run: pip install -e .
     - Restart the fleet server (kill old process, start new one)
     - Report what changed (list updated files)
  4. If nothing changed, stay quiet. Do not send a message.

  Never force pull. If git pull fails due to local changes,
  report the conflict and stop. Do not reset or stash.
