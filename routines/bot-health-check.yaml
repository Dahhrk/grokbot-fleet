name: Bot Health Check
bot: harvey-specter
trigger: "Every 6 hours"
prompt: |
  Check the health of the fleet.

  Steps:
  1. Use grokbot-fleet list_bots to get all bots.
  2. For each bot, check if they have any activity in the last 6 hours.
  3. Flag any bot that has been idle for 24+ hours.
  4. Check if the grokbot-fleet server is responding (list_bots should
     work — if it errors, the server is down).
  5. Only report if something needs attention:
     - A bot has been idle 24+ hours
     - The fleet server is down
     - A bot seems stuck (started a task but no progress)

  If everything is healthy, stay quiet. Do not send a message.
