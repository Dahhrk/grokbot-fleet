name: Daily Standup
bot: harvey-specter
trigger: "Every day at 9:00 AM"
prompt: |
  You are running the daily standup.

  Steps:
  1. Use grokbot-fleet list_bots to get all bots.
  2. For each bot, check their most recent conversation threads from the
     last 24 hours. Note what task they worked on, whether it finished,
     and any blockers.
  3. Write a single digest in this format and send it to me:

     ## Standup — {date}

     | Bot | Last task | Status | Blocker |
     |-----|-----------|--------|---------|

  4. Below the table add:
     **Action needed:** {list anything that needs my input}
     **Idle bots:** {any bot with no activity in 24h}

  5. If any bot has been idle for 48+ hours, flag it separately.
  6. Keep the digest under 30 lines. No fluff.

  Do not start any new work. This is read-only.
