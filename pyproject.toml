[project]
name = "grokbot-fleet"
version = "1.0.0"
description = "Open-source MCP to list and update Grok Bots (prompts, routines, skills) via a Fleet bot"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grokbot_fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
